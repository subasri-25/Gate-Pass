<!DOCTYPE html>
<html>
<body>

<h2>Student Dashboard</h2>

<form action="/apply" method="POST">
    <input name="name" placeholder="Name" required><br><br>
    <input name="phone" placeholder="Phone (+91...)" required><br><br>
    <input name="reason" placeholder="Reason" required><br><br>
    <button>Apply</button>
</form>

<h3>Your Requests</h3>

{% for r in requests %}
<div style="border:1px solid black; margin:10px; padding:10px;">
    <p>Name: {{r.name}}</p>
    <p>Reason: {{r.reason}}</p>
    <p>Status: {{r.status}}</p>

    <img src="/static/qrcodes/request_{{r.id}}.png" width="120">
</div>
{% endfor %}

</body>
</html>
