<!DOCTYPE html>
<html>
<body>

<h2>Admin Dashboard</h2>

{% for r in requests %}
<div style="border:1px solid black; margin:10px; padding:10px;">
    <p>Name: {{r.name}}</p>
    <p>Reason: {{r.reason}}</p>
    <p>Status: {{r.status}}</p>

    <a href="/approve/{{r.id}}"><button>Approve</button></a>
    <a href="/deny/{{r.id}}"><button>Deny</button></a>
</div>
{% endfor %}

</body>
</html>
